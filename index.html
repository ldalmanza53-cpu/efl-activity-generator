<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFL Activity Generator Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-4xl flex items-center justify-between mb-8">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2.5 rounded-lg shadow-lg shadow-indigo-600/30">
                <i data-lucide="zap" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">EFL Activity Generator</h1>
                <p class="text-xs text-indigo-300 font-medium">Interactive Speaking Studio</p>
            </div>
        </div>
    </header>

    <!-- FORM SECTION -->
    <main id="form-section" class="w-full max-w-4xl glass-panel rounded-2xl p-6 md:p-8 shadow-2xl transition-all duration-300">
        <div class="space-y-6">
            
            <!-- Top Configuration Row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Gemini API Key</label>
                    <input type="password" id="api-key" placeholder="Paste API Key..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">CEFR Level</label>
                    <select id="level" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="A1">A1 - Beginner</option>
                        <option value="A2" selected>A2 - Elementary</option>
                        <option value="B1">B1 - Intermediate</option>
                        <option value="B2">B2 - Upper Intermediate</option>
                        <option value="C1">C1 - Advanced</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Students per Group (1 to 6)</label>
                    <input type="number" id="students" min="1" max="6" value="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- 6 Predetermined Class/Unit Slots -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Class / Unit Slots (6 Slots Available)</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                    <div>
                        <span class="text-[10px] text-slate-400 font-semibold block mb-1">Class 1</span>
                        <input type="text" id="class-1" placeholder="E.g., 47 (p.132)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 font-semibold block mb-1">Class 2</span>
                        <input type="text" id="class-2" placeholder="E.g., 55 (p.155)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 font-semibold block mb-1">Class 3</span>
                        <input type="text" id="class-3" placeholder="E.g., 57 (p.159)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 font-semibold block mb-1">Class 4</span>
                        <input type="text" id="class-4" placeholder="E.g., 59 (p.167)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 font-semibold block mb-1">Class 5</span>
                        <input type="text" id="class-5" placeholder="E.g., 60 (p.182)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 font-semibold block mb-1">Class 6</span>
                        <input type="text" id="class-6" placeholder="E.g., 62" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- Objectives Input -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Communicative Objectives & Grammar Focus</label>
                <textarea id="objectives" placeholder="Paste the specific learning targets, vocabulary, and grammar functions here..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 text-sm text-white focus:outline-none focus:border-indigo-500 resize-none h-40"></textarea>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-800 flex justify-end">
            <button onclick="generateActivity()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl flex items-center gap-2 transition-all active:scale-95 shadow-lg shadow-indigo-600/30">
                <i data-lucide="sparkles" class="w-5 h-5"></i> Generate Activity
            </button>
        </div>
    </main>

    <!-- LOADING SECTION -->
    <div id="loading-section" class="hidden w-full max-w-4xl glass-panel rounded-2xl p-12 flex flex-col items-center justify-center gap-4 text-center">
        <div class="spinner"></div>
        <h3 class="text-lg font-bold text-white">Designing Activity...</h3>
        <p class="text-sm text-slate-400">Analyzing specified classes, objectives, and structuring the code (takes approx. 15-20 seconds).</p>
    </div>

    <!-- RESULT SECTION -->
    <div id="result-section" class="hidden w-full max-w-6xl h-[85vh] glass-panel rounded-2xl flex flex-col overflow-hidden shadow-2xl relative">
        <!-- Toolbar -->
        <div class="bg-slate-900 border-b border-slate-700 p-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
                <span class="font-bold text-sm">Activity Generated Successfully</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="downloadHTML()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-colors">
                    <i data-lucide="download" class="w-4 h-4"></i> Download HTML
                </button>
                <button onclick="resetApp()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Create New Activity
                </button>
            </div>
        </div>
        <!-- Iframe Preview -->
        <iframe id="preview-frame" class="w-full flex-1 bg-white border-none"></iframe>
    </div>

    <script>
        lucide.createIcons();

        let generatedHTMLCode = "";

        const systemPrompt = `You are an expert EFL (English as a Foreign Language) Instructional Designer and Senior Front-End Web Developer. Your primary function is to strictly read the user's provided learning objectives and class references, filter/integrate them strictly for the target CEFR level, and build a single-file interactive HTML web application for a speaking production task.

======================================================================
CRITICAL LANGUAGE OVERRIDE DIRECTIVE (ZERO-TOLERANCE RULE)
======================================================================
- REGARDLESS OF THE LANGUAGE THE USER USES IN THEIR PROMPT, YOUR ENTIRE RESPONSE MUST BE 100% IN ENGLISH.
- EVERY SINGLE WORD of your output—including the pedagogical breakdown, scenario summaries, task instructions, 3D flip role cards, phrase toolkits, UI labels, buttons, scratchpad placeholders, and HTML/CSS/JS code—MUST BE STRICTLY WRITTEN IN ENGLISH.
- DO NOT WRITE A SINGLE WORD OF SPANISH IN ANY PART OF YOUR RESPONSE OR INSIDE THE HTML CODE.

======================================================================
CRITICAL DOCUMENT & INPUT PARSING PROTOCOL
======================================================================
- Parse all specified class/unit numbers, book pages, and communicative objectives provided.
- Synthesize all provided goals into a cohesive speaking scenario.
- Under NO circumstances should you invent or borrow objectives outside of what the user provides.

======================================================================
PEDAGOGICAL & CLASS PROGRESSION DIRECTIVES
======================================================================
- Instructional Language Calibrated to Level: The vocabulary used in task instructions, scenario descriptions, and UI prompts MUST strictly match the target CEFR level. For A1/A2, use simple, high-frequency words, short imperative sentences, and clear visual framing. Never use complex B2/C1 academic vocabulary in lower-level instructions.
- NO TIMERS: Do NOT include any countdown clock, timer, time limit display, or audio beeps in the web application. The activity is self-paced.
- If the student count is 1, adjust the activity to be a presentation, monologue, or direct interactive interview with the teacher.

======================================================================
LAYOUT & UI STRUCTURE REQUIREMENTS
======================================================================
1. THEMATIC & VIBRANT COLOR PALETTE: Use vivid, high-contrast, visually engaging Tailwind CSS color themes customized specifically to the topic or narrative theme of the communicative task (e.g., Emerald/Teal for eco, Amber/Slate for detective, Warm Coral for travel). Avoid plain monochrome or dull grayscale designs.
2. STANDALONE MAIN TASK CARD (PLACED BEFORE ROLES): Position a large, prominent "Main Task & Scenario Overview" card directly ABOVE the role cards grid. Must contain: Full narrative context, Concrete Final Deliverable, and Step-by-Step Mission Stages Breakdown.
3. INTERACTIVE 3D FLIP ROLE CARDS GRID: Built as 3D flip cards using CSS perspective (perspective: 1000px; transform-style: preserve-3d; transition: transform 0.6s;). Front Side: Role title, avatar/icon, persona summary, and a clear "Tap / Click to Flip" button. Back Side: Deep secret backstory, conflicting personal motives, specific data constraints, and a role-specific target language checklist.
4. FULL RESPONSIVENESS: Layout must adapt seamlessly for PC projectors/laptops as well as mobile devices (grid-cols-1 md:grid-cols-2 lg:grid-cols-4).

======================================================================
TECHNICAL FRONT-END GUARDRAILS
======================================================================
- LUCIDE ICON SIZING (MANDATORY): EVERY <i data-lucide="..."> MUST include explicit size classes (e.g., class="w-5 h-5" or class="w-6 h-6"). Un-sized icons break rendering.
- MODAL CONTROLS: Use Tailwind's native 'hidden' class. Include close buttons (w-6 h-6, p-2, cursor-pointer) and a backdrop click handler (closeModalOnBackdrop).
- MANDATORY COMPONENTS: Standalone Large Main Task & Scenario Card, Interactive 3D Flip Role Cards Grid, Clickable Scaffolding Toolkit (navigator.clipboard.writeText), Group Scratchpad textarea, Objectives Dossier Modal.

======================================================================
REQUIRED RESPONSE FORMAT (STRICTLY IN ENGLISH)
======================================================================
1. Pedagogical Overview
- Target CEFR Level & Class References
- Extracted Unit Objectives
- Concrete Deliverable
- Scenario & Progression Analysis
- Mission Stage Breakdown

2. Executable Single-File Web Application Code
Provide one complete, executable HTML block (<!DOCTYPE html>...</html>) ready to run. Do NOT output markdown formatting like \`\`\`html around the code block.`;

        async function generateActivity() {
            const apiKey = document.getElementById('api-key').value.trim();
            const level = document.getElementById('level').value;
            const students = document.getElementById('students').value;
            const objectives = document.getElementById('objectives').value.trim();

            // Collect values from the 6 Class/Unit slots
            const classes = [];
            for (let i = 1; i <= 6; i++) {
                const val = document.getElementById(`class-${i}`).value.trim();
                if (val) classes.push(`Slot ${i}: ${val}`);
            }

            if (!apiKey || !objectives) {
                alert("Please fill in the required fields (API Key and Objectives).");
                return;
            }

            if (students < 1 || students > 6) {
                alert("The number of students must be between 1 and 6.");
                return;
            }

            // Show Loading and hide Form
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');

            const classRefText = classes.length > 0 ? classes.join(", ") : "Not specified";

            const userPrompt = `Please generate the 3D flip-card speaking activity web app based on the following parameters:
- Target CEFR Level: ${level}
- Specified Class/Unit References (from 6 available slots): ${classRefText}
- Number of Students: ${students}
- Communicative Objectives & Grammar Focus:
${objectives}

Ensure 100% English output, no timers, vibrant thematic colors, and adherence to all UI guidelines.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: [{ parts: [{ text: userPrompt }] }],
                        generationConfig: { temperature: 0.7 }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let rawOutput = data.candidates[0].content.parts[0].text;
                
                const htmlMatch = rawOutput.match(/<!DOCTYPE html>[\s\S]*<\/html>/i);
                if (htmlMatch) {
                    generatedHTMLCode = htmlMatch[0];
                } else {
                    generatedHTMLCode = rawOutput.replace(/^```html\s*/i, '').replace(/```\s*$/i, '');
                }

                const iframe = document.getElementById('preview-frame');
                iframe.srcdoc = generatedHTMLCode;

                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');

            } catch (error) {
                alert("Error generating activity: " + error.message);
                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('form-section').classList.remove('hidden');
            }
        }

        function resetApp() {
            generatedHTMLCode = "";
            document.getElementById('preview-frame').srcdoc = "";
            
            // Reset the 6 class slots
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`class-${i}`).value = "";
            }
            
            document.getElementById('objectives').value = "";
            document.getElementById('students').value = "6";
            
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('loading-section').classList.add('hidden');
            document.getElementById('form-section').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function downloadHTML() {
            if (!generatedHTMLCode) return;
            
            const level = document.getElementById('level').value;
            
            const blob = new Blob([generatedHTMLCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = `Speaking_Task_${level}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
